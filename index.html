<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F6F5F2" />
  <title>Cuaderno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F5F2;
      color: #18181B;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }
    .sheet-backdrop {
      transition: opacity 0.25s ease;
    }
    .sheet-panel {
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-28 select-none">

  <!-- PANTALLA DE ACCESO -->
  <div id="loginBox" class="min-h-screen flex flex-col justify-center px-6 max-w-md mx-auto hidden">
    <div class="mb-8">
      <div class="w-12 h-12 rounded-2xl bg-zinc-900 text-white flex items-center justify-center mb-5 shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-zinc-900">Entrar al cuaderno</h1>
      <p class="text-zinc-500 text-sm mt-1">Ingresá tu clave para ver y anotar pedidos.</p>
    </div>

    <div class="space-y-3">
      <input id="inputClave" type="password" inputmode="numeric" placeholder="Clave"
        class="w-full px-4 py-4 rounded-2xl bg-white border border-zinc-200 text-zinc-900 text-lg tracking-widest outline-none focus:border-zinc-900 transition shadow-2xs" />
      <button onclick="guardarClave()"
        class="w-full bg-zinc-900 active:scale-[0.99] transition text-white font-semibold py-4 rounded-2xl text-base shadow-sm">
        Continuar
      </button>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="appBox" class="max-w-md mx-auto hidden">
    
    <!-- HEADER -->
    <header class="px-5 pt-6 pb-4 flex items-center justify-between">
      <div>
        <p class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Resumen general</p>
        <h1 class="text-2xl font-bold tracking-tight text-zinc-900 mt-0.5">Pedidos y caja</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="cargarDatos()" aria-label="Actualizar"
          class="w-10 h-10 rounded-full bg-white border border-zinc-200/80 flex items-center justify-center text-zinc-600 active:scale-95 transition">
          <svg id="iconRefresh" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
        <button onclick="cerrarSesion()" class="text-xs font-medium text-zinc-400 px-2 py-1">Salir</button>
      </div>
    </header>

    <!-- TARJETA PRINCIPAL DE BALANCE -->
    <section class="px-5 mb-6">
      <div class="bg-white rounded-3xl p-5 border border-zinc-200/70 shadow-2xs">
        <div class="flex items-baseline justify-between">
          <span class="text-sm text-zinc-500 font-medium">Ganancia neta</span>
          <span id="badgePendiente" class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200/60 hidden">
            $0 por cobrar
          </span>
        </div>
        <p id="resNeto" class="font-display text-3xl font-bold tracking-tight text-zinc-900 mt-1 num">$0</p>

        <div class="grid grid-cols-2 gap-4 mt-5 pt-4 border-t border-zinc-100">
          <div>
            <p class="text-xs text-zinc-400">Total cobrado</p>
            <p id="resIngresos" class="text-base font-semibold text-emerald-700 mt-0.5 num">$0</p>
          </div>
          <div>
            <p class="text-xs text-zinc-400">Costo producción</p>
            <p id="resCostos" class="text-base font-semibold text-zinc-700 mt-0.5 num">$0</p>
          </div>
        </div>
      </div>
    </section>

    <!-- FILTROS DE LISTA -->
    <section class="px-5">
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex gap-1 bg-zinc-200/60 p-1 rounded-xl overflow-x-auto no-scrollbar">
          <button onclick="filtrar('todos')" id="f-todos" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition shrink-0">
            Todos
          </button>
          <button onclick="filtrar('Pendiente')" id="f-Pendiente" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 transition shrink-0">
            Pendientes
          </button>
          <button onclick="filtrar('Hecho')" id="f-Hecho" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 transition shrink-0">
            Hechos
          </button>
          <button onclick="filtrar('Entregado')" id="f-Entregado" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 transition shrink-0">
            Entregados
          </button>
          <button onclick="filtrar('debe')" id="f-debe" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 transition shrink-0">
            Sin pagar
          </button>
        </div>
        <span id="contadorItems" class="text-xs text-zinc-400 shrink-0"></span>
      </div>

      <!-- LISTA DE MOVIMIENTOS -->
      <div id="listaVentas" class="space-y-2.5"></div>
    </section>

    <!-- BOTÓN FLOTANTE INFERIOR -->
    <div class="fixed bottom-0 inset-x-0 bg-gradient-to-t from-[#F6F5F2] via-[#F6F5F2] to-transparent pt-4 pb-6 px-5 z-20">
      <div class="max-w-md mx-auto">
        <button onclick="abrirModalNuevo()"
          class="w-full bg-zinc-900 active:scale-[0.98] transition text-white font-semibold py-4 px-5 rounded-2xl shadow-lg shadow-zinc-900/15 flex items-center justify-center gap-2 text-base">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          Anotar pedido
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET 1: CREAR O EDITAR PEDIDO -->
  <div id="modalBackdrop" onclick="cerrarTodosLosModales()" class="fixed inset-0 bg-zinc-900/40 backdrop-blur-[2px] z-30 hidden opacity-0 sheet-backdrop"></div>
  
  <div id="modalSheet" class="fixed inset-x-0 bottom-0 z-40 max-w-md mx-auto bg-white rounded-t-3xl shadow-2xl translate-y-full sheet-panel hidden max-h-[92vh] overflow-y-auto">
    <div class="w-10 h-1 bg-zinc-200 rounded-full mx-auto mt-3 mb-2"></div>
    
    <div class="p-5 pb-8 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 id="modalTitulo" class="text-lg font-bold text-zinc-900">Nuevo pedido</h2>
          <p id="modalSubtitulo" class="text-xs text-zinc-400 hidden">Editando pedido existente</p>
        </div>
        <button onclick="cerrarTodosLosModales()" class="text-sm text-zinc-400 font-medium px-2 py-1">Cerrar</button>
      </div>

      <div class="space-y-3">
        <!-- ESTADO DEL PEDIDO (3 OPCIONES) -->
        <div>
          <label class="block text-xs font-medium text-zinc-500 mb-1.5">Estado del pedido</label>
          <div class="grid grid-cols-3 bg-zinc-100 p-1 rounded-xl gap-1">
            <button type="button" id="btnEstPendiente" onclick="setEstadoPedido('Pendiente')"
              class="py-2 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition">
              Pendiente
            </button>
            <button type="button" id="btnEstHecho" onclick="setEstadoPedido('Hecho')"
              class="py-2 rounded-lg text-xs font-medium text-zinc-500 transition">
              Hecho
            </button>
            <button type="button" id="btnEstEntregado" onclick="setEstadoPedido('Entregado')"
              class="py-2 rounded-lg text-xs font-medium text-zinc-500 transition">
              Entregado
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-500 mb-1">Cliente</label>
          <input id="nombre" type="text" placeholder="Nombre de quien compra"
            class="w-full px-3.5 py-3 rounded-xl bg-zinc-50 border border-zinc-200 text-zinc-900 text-base outline-none focus:bg-white focus:border-zinc-900 transition" />
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-zinc-500 mb-1">Producto</label>
            <input id="producto" type="text" placeholder="Ej: Lata"
              class="w-full px-3.5 py-3 rounded-xl bg-zinc-50 border border-zinc-200 text-zinc-900 text-base outline-none focus:bg-white focus:border-zinc-900 transition" />
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-500 mb-1">Cantidad</label>
            <div class="flex items-center bg-zinc-50 border border-zinc-200 rounded-xl overflow-hidden h-[50px]">
              <button type="button" onclick="cambiarCantidad(-1)" class="w-9 h-full text-lg font-semibold text-zinc-600 active:bg-zinc-200">−</button>
              <input id="cantidad" type="number" inputmode="numeric" value="1" oninput="calcularPreview()"
                class="w-full text-center bg-transparent font-semibold text-zinc-900 text-base outline-none num" />
              <button type="button" onclick="cambiarCantidad(1)" class="w-9 h-full text-lg font-semibold text-zinc-600 active:bg-zinc-200">+</button>
            </div>
          </div>
        </div>

        <!-- PRECIO UNITARIO Y GASTO UNITARIO -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-500 mb-1">Precio venta c/u ($)</label>
            <input id="precioUnitario" type="number" inputmode="decimal" placeholder="3500" oninput="calcularPreview()"
              class="w-full px-3.5 py-3 rounded-xl bg-zinc-50 border border-zinc-200 text-zinc-900 text-base font-semibold outline-none focus:bg-white focus:border-zinc-900 transition num" />
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-500 mb-1">Gasto costo c/u ($)</label>
            <input id="gastoUnitario" type="number" inputmode="decimal" placeholder="2600" oninput="calcularPreview()"
              class="w-full px-3.5 py-3 rounded-xl bg-zinc-50 border border-zinc-200 text-zinc-900 text-base font-semibold outline-none focus:bg-white focus:border-zinc-900 transition num" />
          </div>
        </div>

        <!-- PAGO Y MEDIO (MEDIO SE OCULTA SI ELIGE "DEBE") -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <div id="colEstadoPago">
            <label class="block text-xs font-medium text-zinc-500 mb-1.5">Estado del pago</label>
            <div class="grid grid-cols-2 bg-zinc-100 p-1 rounded-xl">
              <button type="button" id="btnPagoSi" onclick="setPago('Sí')"
                class="py-2 rounded-lg text-xs font-semibold bg-white text-emerald-700 shadow-2xs transition">
                Pagado
              </button>
              <button type="button" id="btnPagoNo" onclick="setPago('No')"
                class="py-2 rounded-lg text-xs font-medium text-zinc-500 transition">
                Debe
              </button>
            </div>
          </div>

          <div id="colMedioPago">
            <label class="block text-xs font-medium text-zinc-500 mb-1.5">Medio</label>
            <div class="grid grid-cols-2 bg-zinc-100 p-1 rounded-xl">
              <button type="button" id="btnMedioEf" onclick="setMedio('Efectivo')"
                class="py-2 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition">
                Efectivo
              </button>
              <button type="button" id="btnMedioTr" onclick="setMedio('Transferencia')"
                class="py-2 rounded-lg text-xs font-medium text-zinc-500 transition">
                Transf.
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- TOTAL, GANANCIA Y BOTÓN GUARDAR -->
      <div class="pt-3 border-t border-zinc-100 flex items-center justify-between gap-4">
        <div class="flex gap-5">
          <div>
            <p class="text-[11px] text-zinc-400">Total venta</p>
            <p id="previewTotal" class="font-display text-xl font-bold text-zinc-900 num">$0</p>
          </div>
          <div>
            <p class="text-[11px] text-zinc-400">Ganancia</p>
            <p id="previewGanancia" class="font-display text-xl font-bold text-emerald-700 num">$0</p>
          </div>
        </div>

        <button id="btnGuardarVenta" onclick="guardarFormulario()"
          class="bg-zinc-900 active:scale-[0.98] transition text-white font-semibold px-7 py-3.5 rounded-2xl text-base shadow-sm">
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET 2: ELEGIR MEDIO AL COBRAR UNA DEUDA RÁPIDAMENTE -->
  <div id="pagoSheet" class="fixed inset-x-0 bottom-0 z-40 max-w-md mx-auto bg-white rounded-t-3xl shadow-2xl translate-y-full sheet-panel hidden">
    <div class="w-10 h-1 bg-zinc-200 rounded-full mx-auto mt-3 mb-2"></div>
    
    <div class="p-6 pb-9">
      <div class="flex items-start justify-between mb-5">
        <div>
          <p class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Registrar cobro</p>
          <h2 id="pagoTituloCliente" class="text-xl font-bold text-zinc-900 mt-0.5">¿Cómo pagó?</h2>
          <p id="pagoSubtituloMonto" class="text-sm text-zinc-500 mt-0.5 num"></p>
        </div>
        <button onclick="cerrarTodosLosModales()" class="text-sm text-zinc-400 font-medium px-2 py-1">Cancelar</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="confirmarPagoConMedio('Efectivo')"
          class="flex flex-col items-center justify-center gap-2 py-5 px-4 rounded-2xl bg-zinc-50 border border-zinc-200 active:scale-[0.98] active:bg-zinc-100 transition">
          <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          </div>
          <span class="font-semibold text-zinc-900 text-base">Efectivo</span>
        </button>

        <button onclick="confirmarPagoConMedio('Transferencia')"
          class="flex flex-col items-center justify-center gap-2 py-5 px-4 rounded-2xl bg-zinc-50 border border-zinc-200 active:scale-[0.98] active:bg-zinc-100 transition">
          <div class="w-10 h-10 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
          </div>
          <span class="font-semibold text-zinc-900 text-base">Transferencia</span>
        </button>
      </div>
    </div>
  </div>

  <!-- NOTIFICACIÓN FLOTANTE SUTIL -->
  <div id="toast" class="fixed top-5 inset-x-0 flex justify-center z-50 pointer-events-none hidden">
    <div id="toastText" class="bg-zinc-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzjiw2N6qwaKMkjmL7papv3oYKVxZcThomN-utx84iuEmEV-xvd7gpzMB0RhnRDl7SgqQ/exec";

    let estadoPedido = "Pendiente";
    let estadoPago = "Sí";
    let estadoMedio = "Efectivo";
    let filtroActual = "todos";
    let todasLasVentas = [];
    let pedidoIdEditando = null;
    let pedidoIdACobrar = null;

    function iniciar() {
      if (!localStorage.getItem("pwa_clave")) {
        document.getElementById("loginBox").classList.remove("hidden");
      } else {
        document.getElementById("appBox").classList.remove("hidden");
        cargarDatos();
      }
    }

    function guardarClave() {
      const c = document.getElementById("inputClave").value.trim();
      if (!c) return;
      localStorage.setItem("pwa_clave", c);
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      cargarDatos();
    }

    function cerrarSesion() {
      localStorage.removeItem("pwa_clave");
      location.reload();
    }

    function abrirSheet(sheetId) {
      const backdrop = document.getElementById("modalBackdrop");
      const sheet = document.getElementById(sheetId);
      backdrop.classList.remove("hidden");
      sheet.classList.remove("hidden");
      
      requestAnimationFrame(() => {
        backdrop.classList.remove("opacity-0");
        sheet.classList.remove("translate-y-full");
      });
    }

    function abrirModalNuevo() {
      pedidoIdEditando = null;
      document.getElementById("modalTitulo").textContent = "Nuevo pedido";
      document.getElementById("modalSubtitulo").classList.add("hidden");
      document.getElementById("btnGuardarVenta").textContent = "Guardar";

      document.getElementById("nombre").value = "";
      document.getElementById("producto").value = "";
      document.getElementById("cantidad").value = "1";
      document.getElementById("precioUnitario").value = "";
      document.getElementById("gastoUnitario").value = "";
      
      setEstadoPedido("Pendiente");
      setPago("Sí");
      setMedio("Efectivo");
      calcularPreview();
      abrirSheet("modalSheet");
    }

    function abrirModalEditar(id) {
      const v = todasLasVentas.find(item => String(item.id) === String(id));
      if (!v) return;

      pedidoIdEditando = v.id;
      document.getElementById("modalTitulo").textContent = "Editar pedido";
      const sub = document.getElementById("modalSubtitulo");
      sub.textContent = `Pedido #${v.id} · ${v.fecha}`;
      sub.classList.remove("hidden");
      document.getElementById("btnGuardarVenta").textContent = "Guardar cambios";

      document.getElementById("nombre").value = v.nombre;
      document.getElementById("producto").value = v.producto;
      document.getElementById("cantidad").value = v.cantidad;
      document.getElementById("precioUnitario").value = v.precioUnitario;
      document.getElementById("gastoUnitario").value = v.gastoUnitario;

      setEstadoPedido(v.estado || "Pendiente");
      setPago(v.pago === "Sí" ? "Sí" : "No");
      setMedio(v.medio === "Transferencia" ? "Transferencia" : "Efectivo");
      calcularPreview();
      abrirSheet("modalSheet");
    }

    function abrirModalCobro(event, id, nombre, total) {
      event.stopPropagation(); // Evita que se abra el editor al tocar el botón de cobro
      pedidoIdACobrar = id;
      document.getElementById("pagoTituloCliente").textContent = `Cobrar a ${nombre}`;
      document.getElementById("pagoSubtituloMonto").textContent = `Total: $${Number(total).toLocaleString("es-AR")} · Elegí cómo pagó`;
      abrirSheet("pagoSheet");
    }

    function cerrarTodosLosModales() {
      const backdrop = document.getElementById("modalBackdrop");
      const sheets = ["modalSheet", "pagoSheet"];
      backdrop.classList.add("opacity-0");
      sheets.forEach(s => document.getElementById(s).classList.add("translate-y-full"));
      
      setTimeout(() => {
        backdrop.classList.add("hidden");
        sheets.forEach(s => document.getElementById(s).classList.add("hidden"));
        pedidoIdACobrar = null;
        pedidoIdEditando = null;
      }, 280);
    }

    function cambiarCantidad(delta) {
      const input = document.getElementById("cantidad");
      const actual = Number(input.value) || 1;
      input.value = Math.max(1, actual + delta);
      calcularPreview();
    }

    function setEstadoPedido(val) {
      estadoPedido = val;
      const estilos = {
        Pendiente: { id: "btnEstPendiente", activo: "py-2 rounded-lg text-xs font-semibold bg-white text-amber-700 shadow-2xs transition" },
        Hecho:     { id: "btnEstHecho",     activo: "py-2 rounded-lg text-xs font-semibold bg-white text-sky-700 shadow-2xs transition" },
        Entregado: { id: "btnEstEntregado", activo: "py-2 rounded-lg text-xs font-semibold bg-white text-emerald-700 shadow-2xs transition" }
      };
      const inactivo = "py-2 rounded-lg text-xs font-medium text-zinc-500 transition";

      Object.keys(estilos).forEach(k => {
        document.getElementById(estilos[k].id).className = (k === val) ? estilos[k].activo : inactivo;
      });
    }

    function setPago(val) {
      estadoPago = val;
      const colMedio = document.getElementById("colMedioPago");
      const colEstado = document.getElementById("colEstadoPago");

      if (val === "Sí") {
        document.getElementById("btnPagoSi").className = "py-2 rounded-lg text-xs font-semibold bg-white text-emerald-700 shadow-2xs transition";
        document.getElementById("btnPagoNo").className = "py-2 rounded-lg text-xs font-medium text-zinc-500 transition";
        colMedio.classList.remove("hidden");
        colEstado.classList.remove("col-span-2");
      } else {
        document.getElementById("btnPagoSi").className = "py-2 rounded-lg text-xs font-medium text-zinc-500 transition";
        document.getElementById("btnPagoNo").className = "py-2 rounded-lg text-xs font-semibold bg-white text-amber-700 shadow-2xs transition";
        colMedio.classList.add("hidden");
        colEstado.classList.add("col-span-2");
      }
    }

    function setMedio(val) {
      estadoMedio = val;
      document.getElementById("btnMedioEf").className = val === "Efectivo"
        ? "py-2 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition"
        : "py-2 rounded-lg text-xs font-medium text-zinc-500 transition";
      document.getElementById("btnMedioTr").className = val === "Transferencia"
        ? "py-2 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition"
        : "py-2 rounded-lg text-xs font-medium text-zinc-500 transition";
    }

    function calcularPreview() {
      const cant = Number(document.getElementById("cantidad").value) || 0;
      const pUnit = Number(document.getElementById("precioUnitario").value) || 0;
      const gUnit = Number(document.getElementById("gastoUnitario").value) || 0;

      const total = cant * pUnit;
      const ganancia = (pUnit - gUnit) * cant;

      document.getElementById("previewTotal").textContent = "$" + total.toLocaleString("es-AR");
      const elGanancia = document.getElementById("previewGanancia");
      elGanancia.textContent = "$" + ganancia.toLocaleString("es-AR");
      elGanancia.className = ganancia >= 0
        ? "font-display text-xl font-bold text-emerald-700 num"
        : "font-display text-xl font-bold text-rose-600 num";
    }

    function filtrar(tipo) {
      filtroActual = tipo;
      ["todos", "Pendiente", "Hecho", "Entregado", "debe"].forEach(f => {
        const btn = document.getElementById("f-" + f);
        btn.className = f === tipo
          ? "px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-zinc-900 shadow-2xs transition shrink-0"
          : "px-2.5 py-1.5 rounded-lg text-xs font-medium text-zinc-600 transition shrink-0";
      });
      renderLista();
    }

    async function apiCall(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ clave: localStorage.getItem("pwa_clave"), ...payload })
      });
      return res.json();
    }

    async function guardarFormulario() {
      const nombre = document.getElementById("nombre").value.trim();
      const producto = document.getElementById("producto").value.trim();
      const cantidad = document.getElementById("cantidad").value;
      const precio_unitario = document.getElementById("precioUnitario").value;
      const gasto_unitario = document.getElementById("gastoUnitario").value;
      const btn = document.getElementById("btnGuardarVenta");

      if (!nombre || !producto || !cantidad || !precio_unitario || gasto_unitario === "") {
        mostrarToast("Falta completar algún dato");
        return;
      }

      const esEdicion = pedidoIdEditando !== null;
      btn.disabled = true;
      btn.textContent = "Guardando...";

      try {
        const payload = {
          accion: esEdicion ? "editar_venta" : "agregar_venta",
          nombre,
          producto,
          cantidad,
          precio_unitario,
          gasto_unitario,
          pago: estadoPago,
          medio_pago: estadoPago === "Sí" ? estadoMedio : "Pendiente",
          estado: estadoPedido
        };

        if (esEdicion) payload.id = pedidoIdEditando;

        const data = await apiCall(payload);

        if (data.status === "ok") {
          cerrarTodosLosModales();
          mostrarToast(esEdicion ? "Cambios guardados" : "Pedido anotado");
          cargarDatos();
        } else {
          mostrarToast(data.message);
        }
      } catch (e) {
        mostrarToast("Sin conexión");
      } finally {
        btn.disabled = false;
        btn.textContent = esEdicion ? "Guardar cambios" : "Guardar";
      }
    }

    async function confirmarPagoConMedio(medioElegido) {
      if (!pedidoIdACobrar) return;
      const id = pedidoIdACobrar;
      cerrarTodosLosModales();
      mostrarToast(`Registrando cobro en ${medioElegido}...`);

      const data = await apiCall({
        accion: "confirmar_pago",
        id: id,
        medio_pago: medioElegido
      });

      if (data.status === "ok") {
        mostrarToast("¡Cobro registrado!");
        cargarDatos();
      } else {
        mostrarToast("Error al actualizar");
      }
    }

    async function cargarDatos() {
      const icon = document.getElementById("iconRefresh");
      icon.classList.add("animate-spin");

      try {
        const data = await apiCall({ accion: "leer" });
        if (data.status !== "ok") {
          mostrarToast(data.message);
          return;
        }

        document.getElementById("resIngresos").textContent = "$" + data.resumen.ingresos.toLocaleString("es-AR");
        document.getElementById("resCostos").textContent = "$" + data.resumen.costos.toLocaleString("es-AR");
        document.getElementById("resNeto").textContent = "$" + data.resumen.neto.toLocaleString("es-AR");

        const badge = document.getElementById("badgePendiente");
        if (data.resumen.pendiente > 0) {
          badge.textContent = "$" + data.resumen.pendiente.toLocaleString("es-AR") + " por cobrar";
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }

        todasLasVentas = data.ventas;
        renderLista();
      } catch (e) {
        mostrarToast("Error al actualizar");
      } finally {
        icon.classList.remove("animate-spin");
      }
    }

    function badgeEstadoHTML(estado) {
      if (estado === "Entregado") {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/70">Entregado</span>`;
      }
      if (estado === "Hecho") {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-sky-50 text-sky-700 border border-sky-200/70">Hecho</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-zinc-100 text-zinc-600 border border-zinc-200/70">Pendiente</span>`;
    }

    function renderLista() {
      const lista = document.getElementById("listaVentas");
      let filtradas = todasLasVentas;

      if (filtroActual === "debe") {
        filtradas = todasLasVentas.filter(v => v.pago !== "Sí");
      } else if (filtroActual !== "todos") {
        filtradas = todasLasVentas.filter(v => (v.estado || "Pendiente") === filtroActual);
      }

      document.getElementById("contadorItems").textContent = `${filtradas.length}`;

      if (!filtradas.length) {
        lista.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-zinc-200/60">
            <p class="text-sm text-zinc-400">No hay pedidos en esta vista.</p>
          </div>`;
        return;
      }

      lista.innerHTML = filtradas.map(v => {
        const pagado = v.pago === "Sí";
        const inicial = (v.nombre || "?").charAt(0).toUpperCase();
        const gananciaPedido = (Number(v.precioUnitario) - Number(v.gastoUnitario)) * Number(v.cantidad);
        const nombreEscapado = (v.nombre || "").replace(/'/g, "\\'");

        return `
          <div onclick="abrirModalEditar(${v.id})"
            class="bg-white p-4 rounded-2xl border border-zinc-200/70 flex items-center justify-between gap-3 active:bg-zinc-50 transition cursor-pointer">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-full ${pagado ? 'bg-zinc-100 text-zinc-700' : 'bg-amber-100 text-amber-800'} font-display font-bold text-sm flex items-center justify-center shrink-0">
                ${inicial}
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <p class="font-semibold text-zinc-900 text-sm truncate">${v.nombre}</p>
                  ${badgeEstadoHTML(v.estado || "Pendiente")}
                </div>
                <p class="text-xs text-zinc-500 truncate mt-0.5">${v.cantidad} × ${v.producto}</p>
                <p class="text-[11px] text-zinc-400 mt-0.5">
                  ${v.fecha}${pagado ? ` · ${v.medio}` : ''} · <span class="text-emerald-700 font-medium">+$${gananciaPedido.toLocaleString("es-AR")}</span>
                </p>
              </div>
            </div>

            <div class="text-right shrink-0 flex flex-col items-end gap-1.5">
              <span class="font-display font-bold text-sm text-zinc-900 num">$${Number(v.total).toLocaleString("es-AR")}</span>
              ${pagado
                ? `<span class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-50 text-emerald-700">Cobrado</span>`
                : `<button onclick="abrirModalCobro(event, ${v.id}, '${nombreEscapado}', ${v.total})"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-amber-50 text-amber-800 border border-amber-200/80 active:scale-95 transition">
                    Marcar pago
                  </button>`
              }
            </div>
          </div>
        `;
      }).join("");
    }

    function mostrarToast(msg) {
      const el = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 2400);
    }

    iniciar();
  </script>
</body>
</html>
